name: Posting Cadence Nudge

on:
  schedule:
    # ~5:30pm Eastern (accounting for DST drift, same caveat as Row's workout-nudge.yml) = 21:30 UTC EDT
    # Timed to land before the 6pm ET posting peak (Metricool data, 2026-08-05), not after it like the old 8pm slot.
    - cron: '30 21 * * *'
  workflow_dispatch:

jobs:
  nudge:
    runs-on: ubuntu-latest
    steps:
      - name: Send posting cadence nudge
        run: |
          body_file=$(mktemp)
          trap 'rm -f "$body_file"' EXIT
          code=$(curl -sS --retry 2 --retry-delay 3 --connect-timeout 10 --max-time 30 -o "$body_file" -w "%{http_code}" -X POST \
            https://content-nine-chi.vercel.app/api/send-posting-cadence-nudge \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          body=$(cat "$body_file")
          echo "Response code: $code"
          echo "Response body: $body"
          if [ "$code" != "200" ]; then
            echo "Error: unexpected response $code"
            exit 1
          fi
          message=$(echo "$body" | jq -r '.message')
          if [ "$message" = "Pushed" ]; then
            sent=$(echo "$body" | jq -r '.sent')
            total=$(echo "$body" | jq -r '.total')
            if [ "$sent" != "$total" ]; then
              echo "Error: only $sent/$total pushes actually succeeded"
              exit 1
            fi
          fi
